<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot Mapper</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='6' fill='%230d1b2e'/%3E%3Cpath d='M3 9h7l8 10h7' fill='none' stroke='%235b8cff' stroke-width='3.6' stroke-linecap='round'/%3E%3Cpath d='M3 19h7l8-10h7' fill='none' stroke='%23ff5a52' stroke-width='3.6' stroke-linecap='round'/%3E%3Ccircle cx='14' cy='14' r='4.2' fill='white' stroke='%230d1b2e' stroke-width='2.2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

<header id="topbar">
  <div class="brand"><span id="brand-mark"></span><span>Chatbot Mapper</span></div>
  <input id="flow-name" type="text" spellcheck="false" aria-label="Nome do fluxo" placeholder="Nome do fluxo">

  <div class="tb-group" role="group" aria-label="Histórico">
    <button id="btn-undo" class="btn icon ghost" data-icon="undo" title="Desfazer (Ctrl+Z)" aria-label="Desfazer"></button>
    <button id="btn-redo" class="btn icon ghost" data-icon="redo" title="Refazer (Ctrl+Y)" aria-label="Refazer"></button>
  </div>

  <div id="search-wrap" role="search">
    <span class="search-ico" data-icon="search"></span>
    <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="Buscar" aria-label="Buscar passo pelo nome ou texto" aria-controls="search-results" aria-expanded="false">
    <kbd class="search-kbd">/</kbd>
    <div id="search-results" role="listbox" hidden></div>
  </div>

  <div class="spacer"></div>

  <div class="tb-group">
    <button id="btn-add" class="btn primary" title="Adicionar um passo (duplo clique no mapa)"><span data-icon="plus"></span>Passo</button>
    <button id="btn-layout" class="btn ghost" title="Organizar em linhas por grupo"><span data-icon="layout"></span>Organizar</button>
    <button id="btn-fit" class="btn icon ghost" data-icon="fit" title="Enquadrar (F)" aria-label="Enquadrar o mapa"></button>
  </div>

  <div class="tb-group">
    <div id="file-wrap" class="menu-wrap">
      <button id="btn-file" class="btn ghost" aria-haspopup="menu" aria-expanded="false">Arquivo<span data-icon="chevron"></span></button>
      <div id="file-menu" class="menu" role="menu">
        <button role="menuitem" data-file="new"><b>Novo fluxo</b><small>Começa um fluxo em branco.</small></button>
        <button role="menuitem" data-file="open"><b>Abrir .json…</b><small>Ou arraste o arquivo para a tela.</small></button>
        <button role="menuitem" data-file="example"><b>Abrir o exemplo</b><small>Fluxo genérico com todos os recursos.</small></button>
        <button role="menuitem" data-file="save"><b>Salvar fluxo (.json)</b><small>Seu arquivo de trabalho. Ctrl+S.</small></button>
        <button role="menuitem" data-file="version"><b>Salvar versão</b><small>Guarda uma cópia para comparar depois.</small></button>
      </div>
    </div>
    <div id="export-wrap" class="menu-wrap">
      <button id="btn-export" class="btn ghost" aria-haspopup="menu" aria-expanded="false">Exportar<span data-icon="chevron"></span></button>
      <div id="export-menu" class="menu" role="menu">
        <span class="menu-h">Para o cliente</span>
        <button role="menuitem" data-export="review"><b>Revisão para o cliente</b><small>.html: aprova ou pede ajuste passo a passo.</small></button>
        <button role="menuitem" data-export="player"><b>Simulador</b><small>.html único com a conversa navegável.</small></button>
        <button role="menuitem" data-export="doc"><b>Documento para validação</b><small>.html pronto para imprimir em PDF.</small></button>
        <span class="menu-h">Para o desenvolvimento</span>
        <button role="menuitem" data-export="spec"><b>Especificação (.html)</b><small>Passos, regras, integrações, dicionário, templates.</small></button>
        <button role="menuitem" data-export="specmd"><b>Especificação (.md)</b><small>A mesma especificação em Markdown.</small></button>
        <button role="menuitem" data-export="meta"><b>Mensagens para a Meta</b><small>.json no formato da WhatsApp Cloud API.</small></button>
        <span class="menu-h">Pauta</span>
        <button role="menuitem" data-export="csv"><b>Pendências (.csv)</b><small>Abre no Excel; vira pauta de reunião.</small></button>
        <button role="menuitem" data-export="md"><b>Documento em Markdown</b><small>Para wikis e repositórios.</small></button>
      </div>
    </div>
    <button id="btn-present" class="btn ghost" title="Modo apresentação"><span data-icon="present"></span>Apresentar</button>
    <button id="btn-theme" class="btn icon ghost" data-icon="theme" title="Tema claro ou escuro" aria-label="Alternar tema"></button>
  </div>
  <button id="btn-exit-present" class="btn primary">Sair da apresentação</button>
</header>

<main id="main">
  <section id="map" tabindex="0" aria-label="Mapa do fluxo">
    <div id="world">
      <div id="lanes"></div>
      <svg id="edges" width="1" height="1" aria-hidden="true"></svg>
      <div id="nodes"></div>
    </div>

    <div id="map-top">
      <nav id="crumbs" aria-label="Escopo do mapa"></nav>
      <div id="filters" role="toolbar" aria-label="Filtros do mapa"></div>
    </div>

    <div id="bulkbar" hidden></div>

    <div id="empty-hint" hidden>
      <b>Nenhum passo aqui</b>
      <span>Dê um duplo clique no mapa ou use <kbd>+ Passo</kbd> para criar o primeiro.</span>
    </div>

    <div id="map-hud">
      <div class="legend" aria-label="Legenda">
        <span id="legend-marks"></span>
        <span id="save-state" role="status"></span>
      </div>
      <div class="hud-right">
        <canvas id="minimap" width="220" height="140" aria-label="Minimapa: clique para mover a vista"></canvas>
        <div class="zoom">
          <button id="zoom-out" class="btn icon ghost" data-icon="minus" aria-label="Diminuir zoom"></button>
          <span id="zoom-label">100%</span>
          <button id="zoom-in" class="btn icon ghost" data-icon="plus" aria-label="Aumentar zoom"></button>
        </div>
      </div>
    </div>
  </section>

  <aside id="panel">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="edit" class="on">Editar</button>
      <button role="tab" data-tab="sim">Simular</button>
      <button role="tab" data-tab="tests">Testes <span id="tests-badge" class="badge" hidden></span></button>
      <button role="tab" data-tab="data">Dados</button>
      <button role="tab" data-tab="review">Revisão <span id="review-badge" class="badge" hidden></span></button>
    </nav>

    <div id="tab-edit" class="pane on" role="tabpanel"></div>

    <div id="tab-sim" class="pane" role="tabpanel">
      <div class="sim-bar">
        <label class="sim-persona">Persona <select id="sim-persona"></select></label>
        <button id="sim-restart" class="btn sm ghost"><span data-icon="restart"></span>Reiniciar</button>
        <button id="sim-from" class="btn sm ghost" title="Começa a conversa pelo passo selecionado no mapa"><span data-icon="play"></span>Daqui</button>
        <button id="sim-rec" class="btn sm ghost" title="Grava as escolhas como cenário de teste"><span data-icon="record" class="rec-dot"></span>Gravar</button>
      </div>
      <div id="sim-recbar" class="recbar" hidden></div>
      <div class="sim-opts">
        <label><input type="checkbox" id="sim-tags"> Nome dos passos</label>
        <label><input type="checkbox" id="sim-follow" checked> Seguir no mapa</label>
      </div>
      <button id="sim-stale" class="stale" hidden>O fluxo mudou. Clique para atualizar a simulação.</button>
      <div id="sim-phone"></div>
    </div>

    <div id="tab-tests" class="pane" role="tabpanel"></div>
    <div id="tab-data" class="pane" role="tabpanel"></div>
    <div id="tab-review" class="pane" role="tabpanel"></div>
  </aside>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-input" accept=".json,application/json" hidden>
<input type="file" id="compare-input" accept=".json,application/json" hidden>
<input type="file" id="review-input" accept=".json,application/json" hidden>

<script src="js/flow.js"></script>
<script src="js/meta.js"></script>
<script src="js/analysis.js"></script>
<script src="js/example.js"></script>
<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script src="js/player-css.js"></script>
<script src="js/player.js"></script>
<script src="js/review.js"></script>
<script src="js/fonts-data.js"></script>
<script src="js/exporters.js"></script>
<script src="js/graph.js"></script>
<script src="js/minimap.js"></script>
<script src="js/search.js"></script>
<script src="js/inspector.js"></script>
<script src="js/panels.js"></script>
<script src="js/app.js"></script>
</body>
</html>
